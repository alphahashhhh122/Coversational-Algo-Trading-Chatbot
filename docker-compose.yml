services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      IIMC_ENVIRONMENT: production
      IIMC_DATABASE_PATH: /app/data/iimc_platform.duckdb
      IIMC_ARTIFACTS_DIR: /app/artifacts
      IIMC_AUTH_REQUIRED: "true"
      IIMC_AUTH_SECRET: ${IIMC_AUTH_SECRET:?set IIMC_AUTH_SECRET}
      IIMC_ALLOWED_HOSTS: ${IIMC_ALLOWED_HOSTS:-localhost,127.0.0.1}
      IIMC_ALLOW_LIVE_TRADING: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENALGO_API_KEY: ${OPENALGO_API_KEY:-}
      OPENALGO_BASE_URL: ${OPENALGO_BASE_URL:-http://host.docker.internal:5000}
      IIMC_OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: iimc-trading-platform-api
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      IIMC_OTEL_SAMPLE_RATIO: ${IIMC_OTEL_SAMPLE_RATIO:-1.0}
    depends_on:
      - otel-collector
    volumes:
      - iimc-data:/app/data
      - iimc-artifacts:/app/artifacts
    restart: unless-stopped

  maintenance-worker:
    build: .
    profiles: ["maintenance"]
    command: ["python", "-m", "iimc_trading_platform.cli", "run-worker", "--once"]
    environment:
      IIMC_ENVIRONMENT: production
      IIMC_DATABASE_PATH: /app/data/iimc_platform.duckdb
      IIMC_ARTIFACTS_DIR: /app/artifacts
      IIMC_AUTH_REQUIRED: "true"
      IIMC_AUTH_SECRET: ${IIMC_AUTH_SECRET:?set IIMC_AUTH_SECRET}
      IIMC_ALLOW_LIVE_TRADING: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENALGO_API_KEY: ${OPENALGO_API_KEY:-}
      OPENALGO_BASE_URL: ${OPENALGO_BASE_URL:-http://host.docker.internal:5000}
      IIMC_OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: iimc-trading-platform-maintenance
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      IIMC_OTEL_SAMPLE_RATIO: ${IIMC_OTEL_SAMPLE_RATIO:-1.0}
    volumes:
      - iimc-data:/app/data
      - iimc-artifacts:/app/artifacts

  task-worker:
    build: .
    profiles: ["maintenance"]
    command: ["python", "-m", "iimc_trading_platform.cli", "run-task-worker", "--once"]
    environment:
      IIMC_ENVIRONMENT: production
      IIMC_DATABASE_PATH: /app/data/iimc_platform.duckdb
      IIMC_ARTIFACTS_DIR: /app/artifacts
      IIMC_AUTH_REQUIRED: "true"
      IIMC_AUTH_SECRET: ${IIMC_AUTH_SECRET:?set IIMC_AUTH_SECRET}
      IIMC_ALLOW_LIVE_TRADING: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENALGO_API_KEY: ${OPENALGO_API_KEY:-}
      OPENALGO_BASE_URL: ${OPENALGO_BASE_URL:-http://host.docker.internal:5000}
      IIMC_OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: iimc-trading-platform-task-worker
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      IIMC_OTEL_SAMPLE_RATIO: ${IIMC_OTEL_SAMPLE_RATIO:-1.0}
    volumes:
      - iimc-data:/app/data
      - iimc-artifacts:/app/artifacts

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.19.0
    ports:
      - "16686:16686"
    restart: unless-stopped

volumes:
  iimc-data:
  iimc-artifacts:

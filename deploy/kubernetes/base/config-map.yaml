apiVersion: v1
kind: ConfigMap
metadata:
  name: iimc-platform-config
data:
  IIMC_ENVIRONMENT: production
  IIMC_LOG_LEVEL: INFO
  IIMC_DATABASE_PATH: /app/data/iimc_platform.duckdb
  IIMC_ARTIFACTS_DIR: /app/artifacts
  IIMC_AUTH_REQUIRED: "true"
  IIMC_ALLOWED_HOSTS: algo.example.edu
  IIMC_ALLOW_LIVE_TRADING: "false"
  IIMC_RATE_LIMIT_PER_MINUTE: "120"
  IIMC_MAX_REQUEST_BYTES: "1000000"
  OPENAI_MODEL: gpt-5.5
  OPENALGO_BASE_URL: http://openalgo.openalgo.svc.cluster.local:5000
  IIMC_OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: iimc-trading-platform-api
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318/v1/traces
  IIMC_OTEL_SAMPLE_RATIO: "0.25"
  IIMC_OTEL_EXCLUDED_URLS: live,health,ready,metrics

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iimc-platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - algo.example.edu
      secretName: iimc-platform-tls
  rules:
    - host: algo.example.edu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iimc-platform
                port:
                  name: http

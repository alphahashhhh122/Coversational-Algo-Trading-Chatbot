# CI for the trading platform.
#
# The suite is serial-only (shared DuckDB files lock under concurrency), so
# each job runs pytest in a single process — never parallelised.
#   - fast: unit tests (skips full-app "integration" modules) on every push/PR.
#   - full: the entire suite on main and nightly.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 0 * * *" # nightly full run (00:30 UTC)

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Unit tests (not integration)
        run: python -m pytest tests/ -m "not integration" -p no:cacheprovider -q

  full:
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Full suite (serial)
        run: python -m pytest tests/ -p no:cacheprovider -q
